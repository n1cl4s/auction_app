<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title description">
  <title id="title">Auction API architecture</title>
  <desc id="description">The application connects API clients to MySQL through REST endpoints, bid rules and SQL repositories. Integration tests host the same API and use a separate temporary MySQL container.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; text-anchor: middle; }
      .heading { font-size: 30px; font-weight: 700; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .detail { font-size: 15px; fill: #475569; }
      .box { stroke-width: 1.5; }
      .connector { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="758" rx="20" fill="#ffffff" stroke="#d9e2ec"/>
  <text class="heading" x="560" y="52">Auction API architecture</text>

  <rect x="24" y="78" width="520" height="654" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="576" y="78" width="520" height="654" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="section" x="284" y="117">Application</text>
  <text class="section" x="836" y="117">Integration tests</text>

  <rect class="box" x="54" y="142" width="460" height="95" rx="12" fill="#eaf1ff" stroke="#cadbf6"/>
  <text class="label" x="284" y="178">API client</text>
  <text class="detail" x="284" y="205">Postman or another HTTP client</text>

  <rect class="box" x="54" y="272" width="460" height="100" rx="12" fill="#e7f7f1" stroke="#c3e8d9"/>
  <text class="label" x="284" y="309">ASP.NET Core Minimal API</text>
  <text class="detail" x="284" y="337">Endpoints, validation and session cookies</text>

  <rect class="box" x="54" y="407" width="460" height="100" rx="12" fill="#fff5e5" stroke="#f2dcbc"/>
  <text class="label" x="284" y="444">Repositories and bid rules</text>
  <text class="detail" x="284" y="472">MySqlConnector and parameterized SQL</text>

  <rect class="box" x="54" y="542" width="460" height="100" rx="12" fill="#eaf1ff" stroke="#cadbf6"/>
  <text class="label" x="284" y="579">MySQL database</text>
  <text class="detail" x="284" y="607">Users, auctions and bids</text>

  <path class="connector" d="M284 239 V267"/>
  <path class="connector" d="M284 374 V402"/>
  <path class="connector" d="M284 509 V537"/>

  <rect class="box" x="606" y="142" width="460" height="95" rx="12" fill="#eaf1ff" stroke="#cadbf6"/>
  <text class="label" x="836" y="178">xUnit integration tests</text>
  <text class="detail" x="836" y="205">Send HTTP requests with a test client</text>

  <rect class="box" x="606" y="272" width="460" height="100" rx="12" fill="#e7f7f1" stroke="#c3e8d9"/>
  <text class="label" x="836" y="309">ASP.NET Core test server</text>
  <text class="detail" x="836" y="337">Hosts the same API in the test process</text>

  <rect class="box" x="606" y="407" width="460" height="100" rx="12" fill="#fff5e5" stroke="#f2dcbc"/>
  <text class="label" x="836" y="444">Repositories and bid rules</text>
  <text class="detail" x="836" y="472">Application code uses the test connection</text>

  <rect class="box" x="606" y="542" width="460" height="100" rx="12" fill="#eaf1ff" stroke="#cadbf6"/>
  <text class="label" x="836" y="579">Temporary MySQL container</text>
  <text class="detail" x="836" y="607">Testcontainers, separate from the app database</text>

  <path class="connector" d="M836 239 V267"/>
  <path class="connector" d="M836 374 V402"/>
  <path class="connector" d="M836 509 V537"/>

  <text class="detail" x="560" y="696">The API does not yet expose car details, image upload or Buy Now operations.</text>
</svg>
